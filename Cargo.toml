[package]
name = "hotmilk-code"
version = "0.1.0"
edition = "2021"
authors = ["Hotmilk Studio"]
description = "Local-first AI coding assistant CLI"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
async-trait = "0.1"
ratatui = "0.26"
crossterm = "0.27"
ripgrep = "0.10" # Simplified representation, usually via wrapper
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
```
